name: Build and test FaceTrackCam
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 and verify modern iOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Test framing and stream protocol
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath derived_data | tee build.log
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath simulator_data | tee simulator-build.log
      - name: Verify Live Activity packaging
        run: |
          APP=derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app
          test -d "$APP/PlugIns/StreamActivity.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/StreamActivity.appex/Info.plist")" = com.apple.widgetkit-extension
      - name: Verify full-screen launch configuration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app/Info.plist
      - name: Test full-screen layout on iPhone 13 Pro and iPhone 17 Pro Max
        run: |
          set -o pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in reversed(json.load(sys.stdin)["runtimes"]) if r["isAvailable"] and "iOS" in r["identifier"]))')
          for MODEL in iPhone-13-Pro iPhone-17-Pro-Max; do
            DEVICE=$(xcrun simctl create "FacePull-$MODEL" "com.apple.CoreSimulator.SimDeviceType.$MODEL" "$RUNTIME")
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcodebuild test -project FaceTrackCam.xcodeproj -scheme FaceTrackCam -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:FacePullUITests -resultBundlePath "layout-$MODEL.xcresult" CODE_SIGNING_ALLOWED=NO -derivedDataPath simulator_data | tee "layout-$MODEL.log"
            xcrun simctl shutdown "$DEVICE"
          done
      - name: Verify app icon source and bundle
        run: |
          ICON=FaceTrackCam/Assets/Icons.xcassets/AppIcon.appiconset/FacePull.png
          APP=derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app
          test "$(sips -g pixelWidth "$ICON" | tail -1 | awk '{print $2}')" = 1024
          test "$(sips -g pixelHeight "$ICON" | tail -1 | awk '{print $2}')" = 1024
          test -s "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")" = AppIcon
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R derived_data/Build/Products/Release-iphoneos/FaceTrackCam.app Payload/
          ditto -c -k --keepParent Payload FaceTrackCam.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FaceTrackCam-unsigned-IPA
          path: FaceTrackCam.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FacePull-Windows-USB
          path: USB/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            simulator-build.log
            layout-*.log
            layout-*.xcresult
