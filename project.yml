name: FaceTrackCam
options:
  bundleIdPrefix: com.custom
targets:
  FaceTrackCam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: 
      - FaceTrackCam
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      INFOPLIST_KEY_NSCameraUsageDescription: "Needs camera for OBS streaming"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
