name: FaceTrackCam
options:
  bundleIdPrefix: com.anmol
targets:
  FaceTrackCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anmol.FaceTrackCam
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "This app uses the camera for live streaming, background replacement, and face tracking."
