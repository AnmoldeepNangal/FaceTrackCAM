name: FaceTrackCam
options:
  bundleIdPrefix: com.anmol
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FaceTrackCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FaceTrackCam
      - path: Core
      - path: Shared
    dependencies:
      - target: StreamActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anmol.FaceTrackCam
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "2.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: FaceTrackCam
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the camera for OBS streaming, face tracking, and background effects."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Send live video to OBS on your local network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  StreamActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StreamActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anmol.FaceTrackCam.StreamActivity
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "2.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: StreamActivity/Info.plist
      properties:
        CFBundleDisplayName: FaceTrackCam Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  FaceTrackCam:
    build:
      targets:
        FaceTrackCam: all

